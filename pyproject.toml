[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentforge"
version = "0.1.0"
description = "Forge tool-calling AI agents in Python, plus a batteries-included terminal agent for developers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3,<3"]
keywords = ["ai", "agents", "tool-calling", "function-calling", "claude", "llm", "cli", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentforge = "agentforge.cli:main"

[project.urls]
Repository = "https://github.com/purple-ranger-0/agentforge"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "SIM105", # contextlib.suppress isn't clearer than try/except/pass
    "RUF001", # ambiguous unicode characters are intentional in terminal output
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately use typing.Optional/Union: users still write them.
"tests/test_schema.py" = ["UP007", "UP045"]
